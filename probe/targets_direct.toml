# Direct (non-OpenRouter) endpoints: Fireworks, Modal, Together, Jarvislabs.
# Same fields as targets.toml. Run with:
#   uv run python benchmarks/provider_matrix/run.py --targets benchmarks/provider_matrix/targets_direct.toml

# --- Fireworks ---

[[target]]
name = "muse-spark-open · fireworks"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
model = "accounts/fireworks/models/muse-spark-open"

[[target]]
name = "deepseek-v4.1-flash · fireworks"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
model = "accounts/fireworks/models/deepseek-v4p1-flash-1017"

[[target]]
name = "glm-5.3-flash · fireworks"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
model = "accounts/fireworks/models/glm-5p3-flash"

[[target]]
name = "kimi-k3 · fireworks"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"
model = "accounts/fireworks/models/kimi-k3"

