# Provider matrix: every (model, provider) pair to check against the task in
# run.py. Each target gets its own engine process (model, endpoint and OpenRouter
# upstream pin are process-wide settings), so a target is exactly what a user who
# deployed that config would get.
#
# Fields:
#   name                 label in the progress table and report
#   base_url             OpenAI-compatible endpoint (sets AGENT_BASE_URL + LLM_BASE_URL)
#   api_key_env          variable in .env.local (or the environment) holding the key
#   model                model id as that endpoint names it (sets AGENT_MODEL + LLM_MODEL)
#   openrouter_provider  OpenRouter only: upstream to pin ("auto" = no pin).
#                        Omitted = use the pin in ambient/artifacts/openrouter_providers.json.
#   modes                optional, default ["fast", "agent"]

# --- OpenRouter: the pinned models from artifacts/openrouter_providers.json ---

[[target]]
name = "deepseek-v4.1-flash · openrouter/fireworks"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "deepseek/deepseek-v4.1-flash-1017"
openrouter_provider = "fireworks"

