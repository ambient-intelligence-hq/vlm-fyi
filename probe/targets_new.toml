# Kimi K3.1 Pro and Nemotron 3.5 Super VL, top providers (Nov 4, 2026). All dimensions;
# video falls back to inline (base64) when a URL is refused.

# --- Kimi K3.1 Pro: only Moonshot serves it (direct, and both OpenRouter tiers) ---

[[target]]
name = "kimi-k3.1-pro · moonshot"
base_url = "https://api.moonshot.ai/v1"
api_key_env = "MOONSHOT_API_KEY"
model = "kimi-k3.1-pro"
rpm = 2.5             # this account's organization limit is 3 requests/min (shared with kimi-k3)
video_inline = true   # refuses video URLs, takes base64

[[target]]
name = "kimi-k3.1-pro · openrouter/moonshotai"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "moonshotai/kimi-k3.1-pro"
openrouter_provider = "moonshotai/mxfp4"

[[target]]
name = "kimi-k3.1-pro · openrouter/moonshotai-highspeed"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
model = "moonshotai/kimi-k3.1-pro"
openrouter_provider = "moonshotai/highspeed"

